name: Codex Protocol
description: >-
  Codex Protocol was a blockchain startup (founded 2018, backed by Pantera
  Capital) that built a decentralized registry for unique physical assets —
  fine art, wine, watches and other collectibles — on Ethereum, using ERC-721
  Codex Records and an ERC-20 Codex Coin (CODX) token, plus a Codex Viewer dapp
  and a Codex Registry REST API. The company is now defunct: its API and dapp
  repositories are archived, its documentation host no longer resolves, and its
  original marketing domain (codexprotocol.com) has been repurposed by a third
  party and redirects offsite. The surviving, verifiable first-party artifacts
  are the codex-protocol GitHub organization (13 repositories of smart
  contracts, services, and tooling) and four @codex-protocol npm packages.
  This profile was surfaced as a Pantera Capital portfolio company and is
  retained in the API Evangelist network as a historical / defunct record.
